services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: whydid
      POSTGRES_PASSWORD: whydid
      POSTGRES_DB: whydid
    ports:
      - "5433:5432"
    volumes:
      - whydid-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whydid"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  whydid-pgdata:
